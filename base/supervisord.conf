; Supervisor program definition for the embedded Docker daemon.
;
; This is a conf.d fragment, not a full supervisord config: Ubuntu's
; `supervisor` apt package ships a default /etc/supervisor/supervisord.conf
; whose [include] section already loads every *.conf file under
; /etc/supervisor/conf.d/, so only a [program:...] stanza belongs here.
;
; This file only configures the program - it does not launch supervisord.
; Whether supervisord itself ever starts (and therefore whether this
; program autostarts) is decided by entrypoint.sh based on setup.json's
; docker.enabled opt-in.
;
; The daemon runs rootful, on the default /var/run/docker.sock. Rootless mode
; was tried first and abandoned: rootless dockerd inside a container cannot
; create its user namespace unless the *outer* container is --privileged
; anyway (verified on both rootless and rootful hosts - relaxing seccomp,
; relaxing AppArmor, and adding SYS_ADMIN all still fail on newuidmap), so it
; bought no reduction in required privilege while costing enforced resource
; limits, kernel-speed networking, macvlan/GPU support and overlay2. Since the
; privileged container is unavoidable, rootful is strictly better here.
;
; Running on the default socket path also means the Docker CLI needs no
; DOCKER_HOST or context to find it, including from `docker exec` shells.
[program:dockerd]
command=/usr/bin/dockerd
autostart=true
autorestart=true
startsecs=5
startretries=3
; These stop settings apply to supervisor-mediated stops (`supervisorctl stop
; dockerd`, supervisord shutdown). They are NOT reached by `docker stop`: the
; container's CMD is PID 1, supervisord runs beside it, and only PID 1 gets the
; SIGTERM — so dockerd is SIGKILLed when the grace period expires. Run
; `supervisorctl stop dockerd` first if you need a clean daemon shutdown.
stopsignal=TERM
stopwaitsecs=30
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=/var/log/supervisor/dockerd.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
