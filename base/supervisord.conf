; Supervisor program definition for the embedded rootless Docker daemon.
;
; This is a conf.d fragment, not a full supervisord config: Ubuntu's
; `supervisor` apt package ships a default /etc/supervisor/supervisord.conf
; whose [include] section already loads every *.conf file under
; /etc/supervisor/conf.d/, so only a [program:...] stanza belongs here.
;
; This file only configures the program - it does not launch supervisord.
; Whether supervisord itself ever starts (and therefore whether this
; program autostarts) is decided by entrypoint.sh based on setup.json's
; docker.enabled opt-in (a later implementation unit).
;
; XDG_RUNTIME_DIR is referenced via supervisor's %(ENV_...)s interpolation
; rather than a hardcoded /run/user/<uid> path, because the dockerd
; account's UID is whatever Ubuntu's useradd auto-assigned at image-build
; time (see base/Dockerfile) - it is not pinned. Whoever launches
; supervisord is responsible for creating /run/user/<uid>, chmod'ing it
; 0700, and exporting XDG_RUNTIME_DIR into supervisord's own process
; environment before starting it; supervisord then passes that value down
; to this program via the interpolation below. dockerd-rootless.sh also
; hard-requires HOME to be set and exist - unlike XDG_RUNTIME_DIR, HOME is
; not UID-dependent (it's the fixed /home/dockerd created by
; `useradd --create-home dockerd`), so it's set directly rather than
; interpolated.
;
; docker-ce-rootless-extras and uidmap both install their binaries
; (dockerd-rootless.sh, rootlesskit, newuidmap, newgidmap, ...) into
; /usr/bin, which is already on supervisord's default PATH - no PATH
; override is needed here.
[program:dockerd]
command=/usr/bin/dockerd-rootless.sh
user=dockerd
environment=XDG_RUNTIME_DIR="%(ENV_XDG_RUNTIME_DIR)s",HOME="/home/dockerd"
autostart=true
autorestart=true
startsecs=5
startretries=3
stopsignal=TERM
stopwaitsecs=30
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=/var/log/supervisor/dockerd.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
